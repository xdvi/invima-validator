name: Zig CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check .

      # Distro package, not PyPI: the runner's python is externally managed
      # (PEP 668), so a plain `pip install` aborts.
      - name: Lint workflows
        run: |
          python3 -c "import yaml" 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-yaml)
          python3 scripts/lint_workflows.py --self-test
          python3 scripts/lint_workflows.py

      - name: Run Unit Tests
        run: zig build test

      - name: Build Release (with UPX)
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          ./scripts/build.sh --release --upx

      # Emulates an older baseline CPU: an instruction the runner supports but
      # deployment hosts lack (e.g. VAES) surfaces as SIGILL here, not in prod.
      # Offline only — under qemu-user the TLS handshake never initializes, so
      # the HTTP path cannot be covered here. It runs natively in live-demo.
      - name: Smoke test under baseline-CPU emulation (Nehalem, no AVX)
        timeout-minutes: 5
        run: |
          sudo apt-get install -y qemu-user
          cp zig-out/lib/libinvima_ffi.so examples/
          qemu-x86_64 -cpu Nehalem "$(command -v python3)" examples/demo.py --offline

  # Non-blocking: asserts real datos.gov.co behavior. Outages are reported here
  # instead of blocking merges.
  live-demo:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run demo against datos.gov.co
        run: |
          zig build
          cp zig-out/lib/libinvima_ffi.so examples/
          python3 examples/demo.py
