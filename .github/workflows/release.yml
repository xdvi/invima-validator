name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-version:
    name: Tag matches build.zig.zon version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A tag can be pushed without ever passing CI, so the guard runs here too.
      - name: Lint workflows
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 scripts/lint_workflows.py --self-test
          python3 scripts/lint_workflows.py

      # TAG arrives via env, never interpolated into the script body: a tag name
      # is attacker-controlled and `${{ }}` is substituted as raw shell text.
      - name: Compare tag against declared version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read .version from build.zig.zon" >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match build.zig.zon version v$version" >&2
            exit 1
          fi
          echo "Tag $TAG matches build.zig.zon version."

  build-assets:
    name: Build assets for ${{ matrix.os }}
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Install UPX (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install upx

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - name: Build and compress (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ./scripts/build.sh --release --upx

      - name: Build and compress (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./scripts/build.sh --release --upx

      - name: Package assets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist-assets bundle
          cp zig-out/lib/libinvima_ffi.so bundle/
          tar czf dist-assets/invima-validator-linux-amd64.tar.gz -C bundle .
          cp zig-out/lib/libinvima_ffi.so dist-assets/libinvima_ffi.so

      - name: Package assets (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist-assets bundle
          cp zig-out/lib/libinvima_ffi.dylib bundle/
          tar czf dist-assets/invima-validator-macos-universal.tar.gz -C bundle .
          cp zig-out/lib/libinvima_ffi.dylib dist-assets/libinvima_ffi.dylib

      - name: Package assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-assets bundle
          cp zig-out/bin/invima_ffi.dll bundle/
          cp zig-out/lib/invima_ffi.lib bundle/
          powershell -Command "Compress-Archive -Path bundle/* -DestinationPath dist-assets/invima-validator-windows-amd64.zip"
          cp zig-out/bin/invima_ffi.dll dist-assets/invima_ffi.dll
          cp zig-out/lib/invima_ffi.lib dist-assets/invima_ffi.lib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: dist-assets/*

  publish-release:
    name: Create GitHub Release
    needs: [build-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts structure
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      # Same env-not-interpolation rule as verify-version above.
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping creation."
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes
          fi
